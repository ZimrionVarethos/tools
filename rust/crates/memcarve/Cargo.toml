[package]
name = "memcarve"
version = "0.1.0"
edition = "2021"
authors = ["DFIR Toolkit Team"]
description = "Ultra-Fast Universal Raw Memory Carver with Reverse-Order & Multi-Page Assembler"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
rayon = "1.10"
regex = "1.10"
colored = "2.1"
comfy-table = "7.1"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
memchr = "2.7"
aho-corasick = "1.1"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
