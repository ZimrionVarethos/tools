[package]
name = "binwalk2"
version = "0.1.0"
edition = "2021"
authors = ["DFIR Toolkit Team"]
description = "Ultra-Fast Universal Forensic Firmware & Binary Signature Carver"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
memmap2 = "0.9"
rayon = "1.10"
aho-corasick = "1.1"
colored = "2.1"
comfy-table = "7.1"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crc32fast = "1.4"
